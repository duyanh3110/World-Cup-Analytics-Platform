spring.application.name=world-cup-analytics

# Support running from the repository root or from backend/.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:worldcup}
spring.datasource.username=${DB_USER:worldcup}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns schema changes; Hibernate only validates mapped entities.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
